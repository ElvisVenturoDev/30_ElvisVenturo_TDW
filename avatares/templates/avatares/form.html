{% extends "base.html" %}

{% block titulo %}Generar avatar{% endblock %}

{% block contenido %}
  <section class="panel panel--form">
    <div class="section-header section-header--stack">
      <div>
        <p class="eyebrow">Nuevo proyecto</p>
        <h2>Generar avatar</h2>
      </div>
    </div>

    <form id="formulario" action="{{ url_for('avatares.procesar') }}" method="POST"
          enctype="multipart/form-data" novalidate class="form-layout">

      <div class="field-group">
        <label for="nombre">Nombre completo *</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez">
        <span class="error" id="error-nombre"></span>
      </div>

      <div class="field-group">
        <label for="email">Correo electrónico *</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
        <span class="error" id="error-email"></span>
      </div>

      <div class="field-group field-group--full">
        <label for="comentario">Comentario (opcional)</label>
        <textarea id="comentario" name="comentario" rows="3" placeholder="Cuéntanos algo sobre la persona..."></textarea>
      </div>

      <div class="field-group field-group--full">
        <label for="imagen">Foto para el avatar *</label>
        <input type="file" id="imagen" name="imagen" accept=".png,.jpg,.jpeg,.webp">
        <small>Formatos permitidos: PNG, JPG, JPEG y WEBP. Máximo 5 MB.</small>
        <span class="error" id="error-imagen"></span>
      </div>

      <div id="vista-previa-contenedor" class="preview-box field-group--full" style="display:none;">
        <label>Vista previa</label>
        <img id="vista-previa" alt="Vista previa de la imagen seleccionada">
      </div>

      <div class="actions-row">
        <button type="submit" class="primary-button">
          Generar avatar
        </button>
      </div>
    </form>
  </section>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
