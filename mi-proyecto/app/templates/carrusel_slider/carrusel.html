{% extends "base.html" %}

{% block titulo %} Carrusel {% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/carrusel.css') }}">
{% endblock %}

{% block contenido %}
<h2>Carrusel de Imágenes</h2>

<div class="carousel">
    <div class="slides" id="slides">
        <div class="slide active"><img src="{{ url_for('static', filename='img/imagen01.jpg') }}" alt="Imagen 1"></div>
        <div class="slide"><img src="{{ url_for('static', filename='img/imagen02.jpg') }}" alt="Imagen 2"></div>
        <div class="slide"><img src="{{ url_for('static', filename='img/imagen03.jpg') }}" alt="Imagen 3"></div>
        <div class="slide"><img src="{{ url_for('static', filename='img/imagen04.jpg') }}" alt="Imagen 4"></div>
        <div class="slide"><img src="{{ url_for('static', filename='img/imagen05.jpg') }}" alt="Imagen 5"></div>
        <div class="slide"><img src="{{ url_for('static', filename='img/imagen06.jpg') }}" alt="Imagen 6"></div>
        <div class="slide"><img src="{{ url_for('static', filename='img/imagen07.jpg') }}" alt="Imagen 7"></div>
        <div class="slide"><img src="{{ url_for('static', filename='img/imagen08.jpg') }}" alt="Imagen 8"></div>
    </div>

    <button class="prev" id="prevBtn">&#10094;</button>
    <button class="next" id="nextBtn">&#10095;</button>
</div>

<div class="dots-container" id="dotsContainer">
    <button class="dot-btn" data-index="0"></button>
    <button class="dot-btn" data-index="1"></button>
    <button class="dot-btn" data-index="2"></button>
    <button class="dot-btn" data-index="3"></button>
    <button class="dot-btn" data-index="4"></button>
    <button class="dot-btn" data-index="5"></button>
    <button class="dot-btn" data-index="6"></button>
    <button class="dot-btn" data-index="7"></button>
</div>
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/carrusel.js') }}"></script>
{% endblock %}
