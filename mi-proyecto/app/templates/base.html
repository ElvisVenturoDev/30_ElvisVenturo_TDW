<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Proyecto Flask{% endblock %}</title>

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block css %}{% endblock %}
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Navegación Estilizada -->
    <nav class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <span class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">FlaskSlider App</span>
            <div class="flex space-x-6">
                <a href="/" class="hover:text-cyan-400 transition-colors duration-200">Inicio</a>
                <a href="/carrusel" class="hover:text-cyan-400 transition-colors duration-200">Carrusel</a>
                <a href="/slider" class="text-cyan-400 font-semibold border-b-2 border-cyan-400 pb-1">Slider Pro</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
        {% block contenido %}{% endblock %}
    </main>

    {% block js %}{% endblock %}
</body>
</html>
