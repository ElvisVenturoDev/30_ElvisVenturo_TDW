{% extends "base.html" %}

{% block title %}Formulario - Página Interactiva{% endblock %}

{% block content %}
<section class="card">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Formulario de Ejemplo</h2>
    
    <form class="space-y-4">
        <div>
            <label class="block text-gray-700 font-semibold mb-2">Nombre:</label>
            <input 
                type="text" 
                placeholder="Ingresa tu nombre"
                class="input-field">
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-2">Email:</label>
            <input 
                type="email" 
                placeholder="tu@email.com"
                class="input-field">
        </div>

        <div>
            <label class="block text-gray-700 font-semibold mb-2">Mensaje:</label>
            <textarea 
                placeholder="Escribe tu mensaje aquí..."
                rows="4"
                class="input-field"></textarea>
        </div>

        <button 
            type="submit"
            class="btn-primary">
            Enviar
        </button>
    </form>
</section>
{% endblock %}
